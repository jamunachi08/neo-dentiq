[project]
name = "neo_dentiq"
authors = [{ name = "Neo Dentiq", email = "hello@neodentiq.app" }]
description = "Dental practice management, clinical charting, sterilisation traceability and dental revenue cycle, built natively on Frappe and ERPNext."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
# The "-dev" lower bound matters: packaging's SpecifierSet excludes pre-releases by
# default, so ">=15.0.0" refuses the "15.0.0-dev" / "16.0.0-dev" versions that bench
# and Frappe Cloud actually report. This is the same form ERPNext ships.
frappe = ">=15.0.0-dev,<17.0.0"
erpnext = ">=15.0.0-dev,<17.0.0"

[tool.bench.dev-dependencies]
# add development dependencies here

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191", "E101", "B017", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
